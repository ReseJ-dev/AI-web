name: ai-web-research

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env}
      SOURCE_POLICY_CONFIG_DIR: /app/config
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
      PROJECT_USER_AGENT: ${PROJECT_USER_AGENT:-AIWebResearchAgent/0.1}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SEARCH_RESULT_RETENTION_ALLOWED: ${SEARCH_RESULT_RETENTION_ALLOWED:-false}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-10}
      SEARCH_MAX_RETRIES: ${SEARCH_MAX_RETRIES:-3}
      SEARCH_BACKOFF_SECONDS: ${SEARCH_BACKOFF_SECONDS:-0.5}
      ROBOTS_CACHE_TTL_SECONDS: ${ROBOTS_CACHE_TTL_SECONDS:-3600}
      ROBOTS_STRICT_MODE: ${ROBOTS_STRICT_MODE:-true}
      COMPLIANCE_HTTP_TIMEOUT_SECONDS: ${COMPLIANCE_HTTP_TIMEOUT_SECONDS:-10}
      TERMS_MAX_DOCUMENTS: ${TERMS_MAX_DOCUMENTS:-3}
      HTML_CONTENT_MAX_CHARS: ${HTML_CONTENT_MAX_CHARS:-20000}
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_MODEL: ${LLM_MODEL:-not-configured}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_HTTP_MAX_RETRIES: ${LLM_HTTP_MAX_RETRIES:-2}
      LLM_RESPONSE_MAX_RETRIES: ${LLM_RESPONSE_MAX_RETRIES:-2}
      LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-0.5}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-60000}
      RESEARCH_SEARCH_BUDGET: ${RESEARCH_SEARCH_BUDGET:-20}
      RESEARCH_SEARCH_PAGE_SIZE: ${RESEARCH_SEARCH_PAGE_SIZE:-20}
      RESEARCH_CRAWL_PAGE_LIMIT: ${RESEARCH_CRAWL_PAGE_LIMIT:-5}
      CRAWLER_REQUEST_DELAY_SECONDS: ${CRAWLER_REQUEST_DELAY_SECONDS:-1}
      CRAWLER_MAX_RESPONSE_BYTES: ${CRAWLER_MAX_RESPONSE_BYTES:-2000000}
      CRAWLER_TIMEOUT_SECONDS: ${CRAWLER_TIMEOUT_SECONDS:-15}
      CRAWLER_MAX_RETRY_AFTER_SECONDS: ${CRAWLER_MAX_RETRY_AFTER_SECONDS:-120}
      OPENCORPORATES_API_KEY: ${OPENCORPORATES_API_KEY:-}
      OPENCORPORATES_LICENSED_DATA_USE_ALLOWED: ${OPENCORPORATES_LICENSED_DATA_USE_ALLOWED:-false}
      OPENCORPORATES_TIMEOUT_SECONDS: ${OPENCORPORATES_TIMEOUT_SECONDS:-10}
      OPENCORPORATES_MAX_RETRIES: ${OPENCORPORATES_MAX_RETRIES:-3}
      OPENCORPORATES_BACKOFF_SECONDS: ${OPENCORPORATES_BACKOFF_SECONDS:-0.5}
      OPENCORPORATES_MAX_RETRY_AFTER_SECONDS: ${OPENCORPORATES_MAX_RETRY_AFTER_SECONDS:-60}
      WIKIDATA_ENABLED: ${WIKIDATA_ENABLED:-false}
      WIKIDATA_TIMEOUT_SECONDS: ${WIKIDATA_TIMEOUT_SECONDS:-15}
      WIKIDATA_MAX_RETRIES: ${WIKIDATA_MAX_RETRIES:-3}
      WIKIDATA_BACKOFF_SECONDS: ${WIKIDATA_BACKOFF_SECONDS:-0.5}
      GEONAMES_USERNAME: ${GEONAMES_USERNAME:-}
      GEONAMES_TIMEOUT_SECONDS: ${GEONAMES_TIMEOUT_SECONDS:-10}
      GEONAMES_MAX_RETRIES: ${GEONAMES_MAX_RETRIES:-3}
      GEONAMES_BACKOFF_SECONDS: ${GEONAMES_BACKOFF_SECONDS:-0.5}
      GEONAMES_CACHE_TTL_SECONDS: ${GEONAMES_CACHE_TTL_SECONDS:-86400}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_CREATE_ALLOWED: ${GOOGLE_SHEETS_CREATE_ALLOWED:-false}
      GOOGLE_SHEETS_TITLE: ${GOOGLE_SHEETS_TITLE:-AI Web Research Results}
      GOOGLE_SHEETS_TIMEOUT_SECONDS: ${GOOGLE_SHEETS_TIMEOUT_SECONDS:-20}
      GOOGLE_SHEETS_MAX_RETRIES: ${GOOGLE_SHEETS_MAX_RETRIES:-3}
      GOOGLE_SHEETS_BACKOFF_SECONDS: ${GOOGLE_SHEETS_BACKOFF_SECONDS:-0.5}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
      - ./.secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    command:
      - streamlit
      - run
      - app/ui/main.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --server.fileWatcherType=poll
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UI_API_BASE_URL: http://api:8000
      UI_API_ACCESS_TOKEN: ${UI_API_ACCESS_TOKEN:-${API_ACCESS_TOKEN:-}}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./app:/app/app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',
          timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:

name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRAVE_SEARCH_API_KEY: ""
      LLM_PROVIDER: disabled
      LLM_API_KEY: ""
      OPENCORPORATES_API_KEY: ""
      WIKIDATA_ENABLED: "false"
      GEONAMES_USERNAME: ""
      GOOGLE_SERVICE_ACCOUNT_JSON: ""
      RUN_LIVE_WEBSITE_SMOKE_TESTS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python with dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff formatting check
        run: python -m ruff format --check .

      - name: mypy
        run: python -m mypy app tests

      - name: pytest with coverage
        run: >-
          python -m pytest -m "not live"
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Validate migrations
        env:
          DATABASE_URL: sqlite:///./data/ci-migrations.db
        run: |
          mkdir -p data
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head

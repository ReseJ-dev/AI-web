[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-web-research-data-extraction-agent"
version = "0.1.0"
description = "A portfolio project for AI-assisted web research and data extraction."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2.0",
    "beautifulsoup4>=4.14,<5.0",
    "fastapi>=0.115,<1.0",
    "google-auth[requests]>=2.40,<3.0",
    "httpx>=0.28,<1.0",
    "idna>=3.10,<4.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "rapidfuzz>=3.14,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "streamlit>=1.41,<2.0",
    "structlog>=25.1,<26.0",
    "tldextract>=5.3,<6.0",
    "trafilatura>=2.1,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
domain-review = "app.cli.main:run"

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
    "types-pyyaml>=6.0,<7.0",
    "types-beautifulsoup4>=4.12,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: explicitly enabled tests that may access approved public websites",
]
